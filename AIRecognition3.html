<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live MNIST DCNN Demonstration</title>
    <!-- LOAD TENSORFLOW.JS VIA CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background: #eef2f3; color: #333; }
        .container { max-width: 480px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.06); margin: 0 auto; }
        h2 { margin-top: 0; color: #1a1a1a; font-size: 22px; }
        canvas { border: 3px solid #1a1a1a; background: black; cursor: crosshair; display: block; margin: 15px 0; border-radius: 6px; box-shadow: inset 0 2px 5px rgba(21, 21, 21, 0.5); }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 6px; border: none; transition: background 0.2s; }
        #classifyBtn { background: #28a745; color: white; }
        #classifyBtn:hover { background: #218838; }
        #classifyBtn:disabled { background: #ccc; cursor: not-allowed; }
        #clearBtn { background: #dc3545; color: white; }
        #clearBtn:hover { background: #c82333; }
        #status { font-weight: 500; margin: 15px 0; color: #666; font-size: 14px; background: #f8f9fa; padding: 10px; border-radius: 6px; border-left: 4px solid #007bff; }
        #result { font-size: 24px; color: #007bff; margin-top: 20px; font-weight: bold; text-align: center; min-height: 32px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Live MNIST Digit Classifier</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 5px;">Draw a single digit (0-9) clearly in the center of the box.</p>
        
        <!-- INTERACTIVE DRAWING SURFACE -->
        <canvas id="drawCanvas" width="280" height="280"></canvas>
        
        <div class="btn-group">
            <button id="classifyBtn" disabled>Classify Number</button>
            <button id="clearBtn">Clear Canvas</button>
        </div>

        <div id="status">Status: Loading pre-trained weights from Google APIs...</div>
        <div id="result"></div>
    </div>

    <script>
        let mnistModel;
        let isModelReady = false;
        
        // Google-hosted official TF.js MNIST pre-trained CNN layers configuration
        const MODEL_URL = 'https://googleapis.com';

        // --- 1. LOAD PRE-TRAINED WEIGHTS VIA HTTP ---
        async function loadPretrainedModel() {
            try {
                // Fetch the topology JSON structure and binary weights directly into the browser
                mnistModel = await tf.loadLayersModel(MODEL_URL);
                
                // Warm up the WebGL engine with a dummy tensor to clear initial optimization latency
                mnistModel.predict(tf.zeros([1, 28, 28, 1])).dispose();
                
                document.getElementById('status').innerText = "Status: Pre-trained CNN loaded successfully! Draw away.";
                document.getElementById('classifyBtn').disabled = false;
                isModelReady = true;
                
                // Print structural layers out to console for student study
                mnistModel.summary();
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Status: Error loading model from CDN network. Check internet connection.";
            }
        }

        // --- 2. RESIZE & IMAGE PROCESSING ENGINE ---
        function processCanvas() {
            return tf.tidy(() => {
                // Read the HTML5 280x280 surface straight into a WebGL pixel tensor
                const rawTensor = tf.browser.fromPixels(canvas);
                
                // Slice 3-channel RGB data down to 1 grayscale channel
                const grayTensor = rawTensor.slice([0, 0, 0], [280, 280, 1]);
                
                // Resample resolution down cleanly to match MNIST 28x28 requirements
                const resizedTensor = tf.image.resizeBilinear(grayTensor, [28, 28]);
                
                // Normalize 0-255 scaling to float 0.0-1.0 array ranges
                const normalizedTensor = resizedTensor.toFloat().div(tf.scalar(255));
                
                // Nest into target batch structure: [1, 28, 28, 1]
                return normalizedTensor.expandDims(0);
            });
        }

        // --- 3. MOUSE INTERACTION CANVAS ENGINE ---
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        // Configure brush constraints (White strokes on black background matches MNIST data)
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 20; 
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        canvas.addEventListener('mousedown', (e) => { drawing = true; draw(e); });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mouseleave', () => { drawing = false; ctx.beginPath(); });

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('result').innerText = "";
        });

        // --- 4. MODEL INFERENCE EXECUTION ---
        document.getElementById('classifyBtn').addEventListener('click', () => {
            if (!isModelReady) return;

            const inputTensor = processCanvas();

            // Run a forward calculation pass through the convolution stacks
            const prediction = mnistModel.predict(inputTensor);
            
            // Extract the numerical index with the highest probability value asynchronously
            const predictedClass = prediction.argMax(1).dataSync()[0];
            const confidenceScores = prediction.dataSync();
            const confidencePercent = (confidenceScores[predictedClass] * 100).toFixed(1);

            // Display results to the lecture hall
            document.getElementById('result').innerText = `Detected Number: ${predictedClass} (${confidencePercent}% certainty)`;

            // Explicitly scrub current operational array chunks out of GPU storage
            inputTensor.dispose();
            prediction.dispose();
        });

        // Boot system automatically on window construction
        loadPretrainedModel();
    </script>
</body>
</html>
