<svg id="app-svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
          <!-- 1. SURFBOARD: Diagonal from Top-Left to Bottom-Right -->
          <g transform="translate(60, 60) rotate(-45) translate(-60, -60)">
            <!-- Surfboard Fin -->
            <path d="M60 95 L66 105 L60 103 Z" fill="#0f766e"></path>
            <!-- Surfboard Hull -->
            <path d="M60 10 C71 26, 73 56, 68 96 L60 101 L52 96 C47 56, 49 26, 60 10 Z" fill="#14b8a6" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"></path>
            <!-- Center Stringer -->
            <line x1="60" y1="13" x2="60" y2="99" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"></line>
            <!-- Deck Stripes -->
            <path d="M51 38 Q60 42 69 38" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"></path>
            <path d="M50 45 Q60 49 70 45" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85"></path>
          </g>

          <!-- 2. MOUNTAIN BIKE: Diagonal from Top-Right to Bottom-Left -->
          <g transform="translate(60, 60) rotate(-45) translate(-60, -60)">
            <!-- Rear Wheel (Bottom-Left after rotation) -->
            <circle cx="27" cy="66" r="14" stroke="#1e293b" stroke-width="3.5" fill="none"></circle>
            <circle cx="27" cy="66" r="10.5" stroke="#64748b" stroke-width="1" stroke-dasharray="2 3" fill="none"></circle>
            <circle cx="27" cy="66" r="2.2" fill="#1e293b"></circle>

            <!-- Front Wheel (Top-Right after rotation) -->
            <circle cx="93" cy="66" r="14" stroke="#1e293b" stroke-width="3.5" fill="none"></circle>
            <circle cx="93" cy="66" r="10.5" stroke="#64748b" stroke-width="1" stroke-dasharray="2 3" fill="none"></circle>
            <circle cx="93" cy="66" r="2.2" fill="#1e293b"></circle>

            <!-- MTB Frame -->
            <path d="M27 66 L48 66 L69 47 L45 47 Z" stroke="#ea580c" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" fill="none"></path>
            <!-- Seat Tube & Post -->
            <line x1="48" y1="66" x2="42" y2="39" stroke="#ea580c" stroke-width="3.2" stroke-linecap="round"></line>
            <!-- Saddle -->
            <line x1="36" y1="39" x2="47" y2="39" stroke="#1e293b" stroke-width="3.2" stroke-linecap="round"></line>
            <!-- Front Fork -->
            <line x1="67" y1="41" x2="93" y2="66" stroke="#1e293b" stroke-width="3.2" stroke-linecap="round"></line>
            <!-- Handlebars -->
            <path d="M62 40 L71 40 L74 37" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
            <!-- Bottom Bracket / Crank -->
            <circle cx="48" cy="66" r="3.5" fill="#1e293b"></circle>
          </g>
        </svg>