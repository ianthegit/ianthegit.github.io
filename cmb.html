    function getWordByIndex(index) {
      const curated = CURATED_LEXICON.find(w => w.id === index);
      if (curated) return curated;

      const seedWord = WORDS_SEED_500[(index - 1) % WORDS_SEED_500.length];
      const hash = (index * 2654435761) % 4294967296;

      const origins = [
        "Late Middle English from Old French", "Derived from Ancient Greek root", 
        "18th Century Latin scientific terminology", "Obsolete Scots dialectical term", 
        "Nautical jargon of Anglo-Saxon origin", "Victorian era literary coinage"
      ];
      const parts = ["noun", "adjective", "verb", "adjective / noun"];

      const realDefs = [
        `Pertaining to or characteristic of ${seedWord.toLowerCase()} in classical literature.`,
        `The state or condition of being remarkably ${seedWord.toLowerCase()} under pressure.`,
        `A rare or obsolete term for a small decorative item found in 19th-century homes.`,
        `To move, act, or speak with unexpected speed and subtle elegance.`,
        `A specialized tool used by medieval craftspeople for fine precision work.`
      ];

      const bluff1List = [
        `A traditional wooden agricultural tool used primarily in Northern Europe.`,
        `The psychological tendency to overestimate one's own navigation skills.`,
        `An ancient unit of measurement equal to roughly three handfuls of grain.`,
        `A quiet architectural archway built into historic monastery courtyards.`
      ];

      const bluff2List = [
        `The subtle echo produced inside empty metallic containers or urns.`,
        `A ceremonial dance performed during autumn grape harvesting festivals.`,
        `A rare mineral deposit characterized by distinct violet and gold flecks.`,
        `The act of forgetting where one placed an essential everyday object.`
      ];

      const ridiculousList = [
        `The specific panic felt when you accidentally text your boss a meme.`,
        `A mythical creature that steals only one sock from every laundry load.`,
        `The sound made when attempting to eat crisp potato chips silently in a cinema.`,
        `The sudden intense desire to rearrange furniture at 2:00 AM on a Tuesday.`
      ];

      return {
        id: index,
        word: seedWord,
        phonetic: `/${seedWord.toLowerCase()}/`,
        partOfSpeech: parts[hash % parts.length],
        origin: origins[hash % origins.length],
        realDefinition: realDefs[hash % realDefs.length],
        plausibleBluff1: bluff1List[(hash + 1) % bluff1List.length],
        plausibleBluff2: bluff2List[(hash + 2) % bluff2List.length],
        ridiculousBluff: ridiculousList[(hash + 3) % ridiculousList.length],
        example: `Scholars were intrigued by the author's subtle use of ${seedWord.toLowerCase()} throughout the chapter.`
      };
    }

    const FULL_500_DATABASE = Array.from({ length: 500 }, (_, i) => getWordByIndex(i + 1));

    function getDailySeed(dateObj = new Date()) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}-${mm}-${dd}`;
      
      let hash = 0;
      for (let i = 0; i < dateStr.length; i++) {
        hash = (hash << 5) - hash + dateStr.charCodeAt(i);
        hash |= 0;
      }
      return { seed: Math.abs(hash), dateStr };
    }

    function getDailyWords(dateObj = new Date()) {
      const { seed, dateStr } = getDailySeed(dateObj);
      const total = FULL_500_DATABASE.length;
      const selectedIndices = [];
      
      let currentSeed = seed;
      while (selectedIndices.length < 5) {
        currentSeed = (currentSeed * 9301 + 49297) % 233280;
        const index = Math.floor((currentSeed / 233280) * total);
        if (!selectedIndices.includes(index)) {
          selectedIndices.push(index);
        }
      }
      
      return {
        dateStr,
        words: selectedIndices.map(i => FULL_500_DATABASE[i])
      };
    }

    function shuffleArray(array, seedVal = null) {
      const arr = [...array];
      let m = arr.length, t, i;
      let s = seedVal || Math.random() * 10000;  
      while (m) {
        s = (s * 9301 + 49297) % 233280;
        i = Math.floor((s / 233280) * m--);
        t = arr[m];
        arr[m] = arr[i];
        arr[i] = t;
      }
      return arr;
    }

    function ConfettiCanvas() {
      const particles = useMemo(() => {
        return Array.from({ length: 45 }).map((_, i) => ({
          id: i,
          x: Math.random() * 100,
          y: Math.random() * -20,
          size: Math.random() * 10 + 6,
          color: ['#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#3B82F6'][Math.floor(Math.random() * 5)],
          duration: Math.random() * 3 + 2,
          delay: Math.random() * 0.5
        }));
      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none z-50 overflow-hidden">
          {particles.map(p => (
            <div
              key={p.id}
              className="absolute rounded-full animate-fall"
              style={{
                left: `${p.x}%`,
                top: `${p.y}%`,
                width: `${p.size}px`,
                height: `${p.size}px`,
                backgroundColor: p.color,
                animationDuration: `${p.duration}s`,
                animationDelay: `${p.delay}s`
              }}
            />
          ))}
        </div>
      );
    }

        if (!currentPracticeWord) return [];
        const opts = [
          { text: currentPracticeWord.realDefinition, type: 'REAL', label: 'Real Definition' },
          { text: currentPracticeWord.plausibleBluff1, type: 'PLAUSIBLE', label: 'Plausible Bluff' },
          { text: currentPracticeWord.plausibleBluff2, type: 'PLAUSIBLE', label: 'Plausible Bluff' },
          { text: currentPracticeWord.ridiculousBluff, type: 'RIDICULOUS', label: 'Ridiculous Bluff' }
        ];
        return shuffleArray(opts, practiceWordIdx * 17);
      }, [currentPracticeWord, practiceWordIdx]);

      const handleSelectDailyOption = (option) => {
        if (selectedOption !== null || dailyAnswers[currentWordIdx]) return;
        
        setSelectedOption(option);
        setShowExplanation(true);

        const isCorrect = option.type === 'REAL';
        const pointsGained = isCorrect ? 100 : 0;

        const updatedAnswers = [...dailyAnswers, {
          wordId: currentDailyWord.id,
          selectedType: option.type,
          points: pointsGained,
          isCorrect
        }];

        setDailyAnswers(updatedAnswers);
        localStorage.setItem(`cmb_answers_${dailyData.dateStr}`, JSON.stringify(updatedAnswers));

        if (updatedAnswers.length === 5) {
          updateLifetimeStats(updatedAnswers);
        }
      };

      const updateLifetimeStats = (answers) => {
        const today = dailyData.dateStr;
        if (stats.lastPlayedDate === today) return;

        const roundScore = answers.reduce((acc, curr) => acc + curr.points, 0);
        const isYesterday = (dateStr) => {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          return dateStr === yesterday.toISOString().split('T')[0];
        };

        let newStreak = 1;
        if (stats.lastPlayedDate && isYesterday(stats.lastPlayedDate)) {
          newStreak = stats.currentStreak + 1;
        }

        const updatedStats = {
          gamesPlayed: stats.gamesPlayed + 1,
          currentStreak: newStreak,
          maxStreak: Math.max(stats.maxStreak, newStreak),
          totalPoints: stats.totalPoints + roundScore,
          perfectScores: roundScore === 500 ? stats.perfectScores + 1 : stats.perfectScores,
          scoreDistribution: {
            ...stats.scoreDistribution,
            [roundScore]: (stats.scoreDistribution[roundScore] || 0) + 1
          },
          lastPlayedDate: today
        };

        setStats(updatedStats);
        localStorage.setItem('cmb_stats', JSON.stringify(updatedStats));
      };

      const handleNextDailyWord = () => {
        if (currentWordIdx < 4) {
          setCurrentWordIdx(prev => prev + 1);
          setSelectedOption(null);
          setShowExplanation(false);

          setActiveTab('stats');

        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.85;
        utterance.lang = 'en-US';
        utterance.onstart = () => setIsSpeaking(true);
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);
        window.speechSynthesis.speak(utterance);

        const totalScore = dailyAnswers.reduce((acc, curr) => acc + curr.points, 0);
        const emojiMap = { REAL: '🟩', PLAUSIBLE: '🟥', RIDICULOUS: '🟨' };
        const emojis = dailyAnswers.map(a => emojiMap[a.selectedType] || '⬛').join('');
        
        return `📖 Call My Bluff (${dailyData.dateStr})\n🎯 Score: ${totalScore}/500\nResult: ${emojis}\n\nCan you unmask the real word from 500+ obscure terms?`;

        const shareText = generateShareText();

                    {(dailyAnswers[currentWordIdx] || showExplanation) && (
                      <div className={`mt-6 p-5 rounded-xl border ${

                          : 'bg-rose-500/10 border-rose-500/30 text-rose-950 dark:text-rose-100'

                        <p className="text-xs sm:text-sm font-medium leading-relaxed mb-2">

                        </p>
                        <div className="text-xs pt-2 border-t border-current/10 font-medium">
                          Etymology: {currentDailyWord.origin}
                        </div>
                      </div>
                    )}
                  </div>

                <div className="flex items-center justify-between pt-2">
                  <button
                    disabled={currentWordIdx === 0}
                    onClick={() => {
                      setCurrentWordIdx(prev => prev - 1);
                      setSelectedOption(null);
                      setShowExplanation(false);
                    }}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
                      currentWordIdx === 0 ? 'opacity-30 cursor-not-allowed' : 'bg-stone-200 dark:bg-slate-800 hover:bg-stone-300 dark:hover:bg-slate-700'

                  >
                    Previous Word

                  {dailyAnswers[currentWordIdx] && (
                    <button
                      onClick={handleNextDailyWord}
                      className="px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-amber-600 hover:bg-amber-500 text-white shadow-md flex items-center space-x-2 transition-all"
                    >
                      <span>{currentWordIdx === 4 ? 'View Summary & Stats' : 'Next Word'}</span>
                      <i data-lucide="arrow-right" className="w-4 h-4"></i>
                    </button>
                  )}
                </div>
              </div>

            {/* PRACTICE MODE */}
            {activeTab === 'practice' && (
              <div className="flex-1 flex flex-col justify-between space-y-6">
                <div className="flex items-center justify-between border-b pb-4 border-stone-200 dark:border-slate-800">
                  <div className="flex items-center space-x-2">
                    <i data-lucide="refresh-cw" className="w-4 h-4 text-amber-600 dark:text-amber-400"></i>
                    <span className="text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-slate-400">

                    Score: <span className="text-amber-600 dark:text-amber-400">{practiceScore}</span> pts
                  </div>

                {currentPracticeWord && (
                  <div className="p-6 sm:p-8 rounded-2xl border shadow-lg bg-white dark:bg-slate-900 border-stone-200 dark:border-slate-800">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b pb-6 border-stone-100 dark:border-slate-800">
                      <div>
                        <div className="flex items-center space-x-3">
                          <h2 className="font-serif text-3xl sm:text-4xl font-bold tracking-tight text-amber-600 dark:text-amber-400">

                          </h2>
                          <button

            {activeTab === 'stats' && (
              <div className="space-y-6">
                <div className="border-b pb-4 border-stone-200 dark:border-slate-800">
                  <h2 className="font-serif text-2xl font-bold">Game Statistics</h2>
                  <p className="text-xs sm:text-sm text-stone-500 dark:text-slate-400 mt-1">
                    Your performance in unmasking real definitions across 500+ obscure words.
                  </p>
                </div>

                {dailyAnswers.length === 5 && (
                  <div className="p-6 rounded-2xl border text-center space-y-4 bg-amber-500/10 dark:bg-slate-900 border-amber-500/30">
                    <div className="flex justify-center items-center space-x-2 text-amber-600 dark:text-amber-400 font-bold">
                      <i data-lucide="award" className="w-6 h-6"></i>
                      <span className="text-lg">Today's Challenge Completed!</span>
                    </div>
                    <div className="font-serif text-3xl font-bold">
                      Score: <span className="text-amber-600 dark:text-amber-400">{totalDailyScore}</span> / 500
                    </div>

                    <div className="flex justify-center space-x-2 text-xl tracking-widest my-2">
                      {dailyAnswers.map((ans, idx) => (
                        <span key={idx}>
                          {ans.selectedType === 'REAL' ? '🟩' : ans.selectedType === 'RIDICULOUS' ? '🟨' : '🟥'}
                        </span>
                      ))}
                    </div>

                    <div className="flex justify-center items-center space-x-3 pt-2">
                      <button
                        onClick={handleShare}
                        className="px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-amber-600 hover:bg-amber-500 text-white shadow-md flex items-center space-x-2 transition-all active:scale-95"
                      >
                        <i data-lucide="share-2" className="w-4 h-4"></i>
                        <span>Share Results</span>
                      </button>
                      {copiedToast && (
                        <span className="text-xs text-emerald-500 font-semibold animate-pulse">
                          Copied!
                        </span>
                      )}
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="p-4 rounded-xl border text-center bg-white dark:bg-slate-900 border-stone-200 dark:border-slate-800">
                    <p className="text-2xl font-bold text-amber-600 dark:text-amber-400">{stats.gamesPlayed}</p>
                    <p className="text-xs text-stone-500 dark:text-slate-400 font-medium mt-1">Games Played</p>
                  </div>

                  <div className="p-4 rounded-xl border text-center bg-white dark:bg-slate-900 border-stone-200 dark:border-slate-800">
                    <p className="text-2xl font-bold text-amber-600 dark:text-amber-400">{stats.currentStreak}</p>
                    <p className="text-xs text-stone-500 dark:text-slate-400 font-medium mt-1">Current Streak</p>
                  </div>

                  <div className="p-4 rounded-xl border text-center bg-white dark:bg-slate-900 border-stone-200 dark:border-slate-800">
                    <p className="text-2xl font-bold text-amber-600 dark:text-amber-400">{stats.maxStreak}</p>
                    <p className="text-xs text-stone-500 dark:text-slate-400 font-medium mt-1">Max Streak</p>
                  </div>

                  <div className="p-4 rounded-xl border text-center bg-white dark:bg-slate-900 border-stone-200 dark:border-slate-800">
                    <p className="text-2xl font-bold text-amber-600 dark:text-amber-400">
                      {stats.gamesPlayed ? Math.round(stats.totalPoints / stats.gamesPlayed) : 0}
                    </p>
                    <p className="text-xs text-stone-500 dark:text-slate-400 font-medium mt-1">Avg Score / Day</p>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="border-t py-4 text-center text-xs border-stone-200 dark:border-slate-800 text-stone-500 dark:text-slate-500">
            <p>Call My Bluff — 500+ Obscure English Word Challenge.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
