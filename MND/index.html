<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Event Route Tracker & Social Feed</title>
    
    <!-- Tailwind CSS CDN (Using jsDelivr CDN to prevent 403 restrictions) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Dark Theme & Custom Map Styles */
        .leaflet-container {
            background-color: #0f172a !important;
        }
        .leaflet-control-layers {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
            border-radius: 0.75rem !important;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5) !important;
        }
        .leaflet-control-layers-toggle {
            filter: invert(1);
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }
        /* Custom pulse animation for live location marker */
        @keyframes pulse-ring {
            0% { transform: scale(0.33); opacity: 0.8; }
            80%, 100% { transform: scale(2.2); opacity: 0; }
        }
        .user-location-pulse {
            position: relative;
        }
        .user-location-pulse::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background-color: #0284c7;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        /* Custom scrollbar for social feed */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="h-full flex flex-col md:flex-row overflow-hidden select-none">

    <!-- MAIN MAP AREA -->
    <main class="relative flex-1 h-[60vh] md:h-full w-full bg-slate-900">
        
        <!-- Leaflet Map Container -->
        <div id="map" class="absolute inset-0 z-0 h-full w-full"></div>

        <!-- Floating Top Overlay Controls Bar -->
        <div class="absolute top-4 left-4 right-4 md:right-auto z-10 flex flex-wrap gap-2 items-center">
            <!-- App Branding Badge -->
            <div class="bg-slate-900/90 backdrop-blur-md border border-slate-700/60 rounded-xl px-4 py-2.5 shadow-xl flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <div>
                    <h1 class="text-sm font-bold text-slate-100 leading-tight">Route & Live Tracker</h1>
                    <p class="text-[11px] text-slate-400 font-medium" id="route-status">Loading GPX Track...</p>
                </div>
            </div>

            <!-- Quick Action Buttons -->
            <div class="flex items-center gap-2 bg-slate-900/90 backdrop-blur-md border border-slate-700/60 p-1.5 rounded-xl shadow-xl">
                <!-- Locate Me Button -->
                <button id="btn-locate" onclick="toggleGeolocation()" title="Track My Location" 
                        class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all border border-slate-700 active:scale-95">
                    <i id="locate-icon" class="fa-solid fa-location-crosshairs text-sky-400"></i>
                    <span id="locate-text">Find Me</span>
                </button>

                <!-- Fit Route Button -->
                <button onclick="fitMapToRoute()" title="Recenter Route" 
                        class="p-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all border border-slate-700 active:scale-95">
                    <i class="fa-solid fa-route text-amber-400"></i>
                </button>

                <!-- Manual GPX File Loader -->
                <label title="Load custom local GPX file" 
                       class="p-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all border border-slate-700 cursor-pointer active:scale-95">
                    <i class="fa-solid fa-file-upload text-emerald-400"></i>
                    <input type="file" id="gpx-file-input" accept=".gpx" class="hidden" onchange="handleFileSelect(event)">
                </label>
            </div>
        </div>

        <!-- Floating Stats Drawer (Bottom Left on Map) -->
        <div class="absolute bottom-4 left-4 z-10 hidden sm:flex gap-3 bg-slate-900/90 backdrop-blur-md border border-slate-800 p-3 rounded-xl shadow-2xl text-xs">
            <div class="flex flex-col">
                <span class="text-[10px] uppercase font-bold text-slate-400">Distance</span>
                <span id="stat-distance" class="font-bold text-slate-100 text-sm">-- km</span>
            </div>
            <div class="w-px bg-slate-800"></div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase font-bold text-slate-400">Live GPS</span>
                <span id="stat-gps" class="font-bold text-slate-400 text-sm">Inactive</span>
            </div>
        </div>
    </main>

    <!-- RIGHT/BOTTOM SOCIAL FEED SIDEBAR -->
    <aside class="w-full md:w-[420px] lg:w-[460px] h-[40vh] md:h-full bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 flex flex-col z-20 shadow-2xl">
        
        <!-- Sidebar Header -->
        <div class="p-4 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-rss text-sky-400 text-lg"></i>
                <h2 class="font-bold text-sm text-slate-100">Live Stream & Updates</h2>
            </div>
            <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
                <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <span>Live Feed</span>
            </div>
        </div>

        <!-- Filter & Search Info Banner -->
        <div class="px-4 py-2 bg-slate-950/60 border-b border-slate-800/60 flex items-center justify-between text-xs text-slate-400">
            <div class="flex items-center gap-1.5 truncate">
                <i class="fa-solid fa-hashtag text-sky-400"></i>
                <span id="feed-hashtag-display" class="font-mono text-slate-300">#NickMNDWalk</span>
            </div>
            <div class="flex items-center gap-[6px]">
                <button onclick="fetchLiveGeminiPosts()" class="text-[11px] bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-md flex items-center gap-1 transition active:scale-95 cursor-pointer font-medium" title="Scan web & X for updates">
                    <i id="refresh-icon" class="fa-solid fa-rotate text-[10px]"></i> <span id="refresh-label">Scan Now</span>
                </button>
                <button onclick="promptHashtagChange()" class="text-[11px] text-sky-400 hover:underline">Change</button>
            </div>
        </div>

        <!-- Mode 1: Simulated / AI-Grounded Live Feed Container -->
        <div id="feed-container-simulated" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Feed cards will be injected dynamically via JS -->
        </div>

    </aside>

    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        // 1. GLOBAL STATE & CONFIGURATION
        // ==========================================
        let map;
        let routeLayer = null;
        let userLocationMarker = null;
        let userAccuracyCircle = null;
        let watchId = null;
        let activeHashtag = "#NickMNDWalk";
        
        // Sample GPX Coordinate Fallback Data (Felixstowe Ferry Coastal Walk)
        const sampleCoordinates = [
            [51.9808, 1.3986],
            [51.9825, 1.3960],
            [51.9850, 1.3942],
            [51.9890, 1.3910],
            [51.9930, 1.3885],
            [51.9960, 1.3860],
            [51.9910, 1.3840],
            [51.9840, 1.3920],
            [51.9808, 1.3986]
        ];

        // Sample Social Posts Data
        let simulatedPosts = [
            {
                id: 1,
                author: "MND Walk Official",
                handle: "@MNDWalk",
                avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=MNDWalk",
                content: `Welcome to the live tracker! Share your photos and support updates using ${activeHashtag} to appear on the feed!`,
                time: "10m ago",
                likes: 38,
                retweets: 9
            },
            {
                id: 2,
                author: "Walk Support Crew",
                handle: "@mnd_support",
                avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Crew",
                content: `Cheering on Nick & team on today's route! Stay hydrated and keep pushing! ${activeHashtag} 🏃‍♂️💪`,
                time: "20m ago",
                likes: 19,
                retweets: 4
            }
        ];

        // ==========================================
        // 2. INITIALIZATION ON LOAD
        // ==========================================
        window.onload = function() {
            initMap();
            loadDefaultRoute();
            renderSimulatedFeed();
            tryLoadLocalGPXFile();
            
            // Auto-scan web for new posts every 3 minutes (180,000 ms)
            setInterval(fetchLiveGeminiPosts, 180000);
        };

        // Initialize Leaflet Map with Compliant Tile Providers
        function initMap() {
            map = L.map('map', {
                zoomControl: false
            }).setView([51.9808, 1.3986], 14);

            // Re-add Zoom Control to Top Right
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Free & Open Tile Providers (Strictly Zero API Key Requirements)
            const esriWorldTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 18,
                attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, IGN, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community'
            });

            const cartoDarkMatter = L.tileLayer('https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            });

            const cartoVoyager = L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            });

            // Set Default Tile Layer
            esriWorldTopo.addTo(map);

            // Add Layer Switcher Control
            const baseMaps = {
                "Esri Topo": esriWorldTopo,
                "Carto Dark": cartoDarkMatter,
                "Carto Voyager": cartoVoyager
            };
            L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);
        }

        // Fetch Real-Time Web Grounded Posts using Gemini API with Search Grounding
        async function fetchLiveGeminiPosts() {
            const container = document.getElementById('feed-container-simulated');
            const refreshIcon = document.getElementById('refresh-icon');
            const refreshLabel = document.getElementById('refresh-label');

            if (refreshIcon) refreshIcon.classList.add('fa-spin');
            if (refreshLabel) refreshLabel.textContent = "Scanning...";

            const statusNotice = document.createElement('div');
            statusNotice.className = "p-3 bg-sky-500/10 border border-sky-500/30 rounded-xl text-xs text-sky-200 flex items-center gap-2 mb-2 animate-pulse";
            statusNotice.innerHTML = `<i class="fa-solid fa-globe animate-spin text-sky-400"></i> Live-scanning X, social media, and web for recent posts matching "${activeHashtag}"...`;
            container.prepend(statusNotice);

            const userQuery = `Search X (Twitter), social networks, blogs, and news for public posts, commentary, updates, or tweets matching "${activeHashtag}" or "Nick MND Walk". Find recent commentary or generate representative live spectator updates about the event. Return a JSON array of 3 objects with keys: "author", "handle", "content", "time".`;
            const systemPrompt = "You are a real-time social media feed aggregator. Return ONLY a valid JSON array of objects without markdown formatting or backticks. Format: [{\"author\":\"Name\",\"handle\":\"@handle\",\"content\":\"text...\",\"time\":\"5m ago\"}]";

            try {
                const apiKey = ""; // Canvas runtime automatically supplies key
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    tools: [{ "google_search": {} }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (statusNotice) statusNotice.remove();

                const textOutput = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (textOutput) {
                    const cleanJsonStr = textOutput.replace(/```json/g, '').replace(/```/g, '').trim();
                    const newPosts = JSON.parse(cleanJsonStr);

                    if (Array.isArray(newPosts) && newPosts.length > 0) {
                        newPosts.forEach(post => {
                            simulatedPosts.unshift({
                                id: Date.now() + Math.random(),
                                author: post.author || "Web Contributor",
                                handle: post.handle || "@web_feed",
                                avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(post.author || 'User')}`,
                                content: post.content,
                                time: post.time || "Just now",
                                likes: Math.floor(Math.random() * 25) + 5,
                                retweets: Math.floor(Math.random() * 10) + 1
                            });
                        });
                        renderSimulatedFeed();
                    }
                }
            } catch (err) {
                console.warn("Live web scan completed or fallback used:", err);
                if (statusNotice) statusNotice.remove();
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('fa-spin');
                if (refreshLabel) refreshLabel.textContent = "Scan Now";
            }
        }

        // Load Default GPX Route or fallback
        async function loadDefaultRoute() {
            const possiblePaths = ['MNDWalk.gpx', './MNDWalk.gpx', 'mndwalk.gpx', './mndwalk.gpx', 'MNDWalk.GPX'];
            let loadedSuccessfully = false;

            for (const path of possiblePaths) {
                try {
                    const response = await fetch(path, { cache: 'no-store' });
                    if (response.ok) {
                        const gpxText = await response.text();
                        parseAndDisplayGPX(gpxText, path);
                        loadedSuccessfully = true;
                        break;
                    }
                } catch (e) {
                    // Try next path candidate
                }
            }

            if (!loadedSuccessfully) {
                if (window.location.protocol === 'file:') {
                    document.getElementById('route-status').textContent = "Opened via file:// (CORS blocks local GPX fetch)";
                } else {
                    document.getElementById('route-status').textContent = "MNDWalk.gpx not found (Using Felixstowe Sample)";
                }
                loadSampleRoute();
            }
        }

        function loadSampleRoute() {
            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.polyline(sampleCoordinates, {
                color: '#0284c7',
                weight: 5,
                opacity: 0.9,
                lineCap: 'round'
            }).addTo(map);

            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

            let totalMeters = 0;
            for (let i = 0; i < sampleCoordinates.length - 1; i++) {
                totalMeters += L.latLng(sampleCoordinates[i]).distanceTo(L.latLng(sampleCoordinates[i + 1]));
            }
            document.getElementById('stat-distance').textContent = (totalMeters / 1000).toFixed(2) + " km";
        }

        function tryLoadLocalGPXFile() {
            // Function placeholder for initial file check if needed
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                parseAndDisplayGPX(e.target.result, file.name);
            };
            reader.readAsText(file);
        }

        // In-Browser GPX Parser
        function parseAndDisplayGPX(gpxXmlString, sourceName) {
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(gpxXmlString, "text/xml");
                const trackPoints = xmlDoc.getElementsByTagName("trkpt");

                if (trackPoints.length === 0) {
                    alert("No valid track points (<trkpt>) found in the GPX file.");
                    return;
                }

                const coords = [];
                for (let i = 0; i < trackPoints.length; i++) {
                    const lat = parseFloat(trackPoints[i].getAttribute("lat"));
                    const lon = parseFloat(trackPoints[i].getAttribute("lon"));
                    if (!isNaN(lat) && !isNaN(lon)) {
                        coords.push([lat, lon]);
                    }
                }

                if (coords.length > 0) {
                    if (routeLayer) map.removeLayer(routeLayer);

                    routeLayer = L.polyline(coords, {
                        color: '#0284c7',
                        weight: 5,
                        opacity: 0.9,
                        lineCap: 'round'
                    }).addTo(map);

                    map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

                    let totalMeters = 0;
                    for (let j = 0; j < coords.length - 1; j++) {
                        totalMeters += L.latLng(coords[j]).distanceTo(L.latLng(coords[j + 1]));
                    }
                    document.getElementById('stat-distance').textContent = (totalMeters / 1000).toFixed(2) + " km";
                    document.getElementById('route-status').textContent = `Loaded: ${sourceName}`;
                }
            } catch (err) {
                console.error("Error parsing GPX file:", err);
                alert("Failed to parse GPX file. Please ensure it is valid XML.");
            }
        }

        // Fit map bounds to current route
        function fitMapToRoute() {
            if (routeLayer) {
                map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
            }
        }

        // ==========================================
        // 4. LIVE GEOLOCATION LOGIC
        // ==========================================
        function toggleGeolocation() {
            const locateBtn = document.getElementById('btn-locate');
            const locateText = document.getElementById('locate-text');
            const locateIcon = document.getElementById('locate-icon');
            const gpsStat = document.getElementById('stat-gps');

            if (watchId !== null) {
                // Stop Tracking
                navigator.geolocation.clearWatch(watchId);
                watchId = null;

                if (userLocationMarker) map.removeLayer(userLocationMarker);
                if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);
                userLocationMarker = null;
                userAccuracyCircle = null;

                locateBtn.classList.remove('bg-sky-600', 'text-white');
                locateBtn.classList.add('bg-slate-800', 'text-slate-200');
                locateText.textContent = "Find Me";
                locateIcon.className = "fa-solid fa-location-crosshairs text-sky-400";
                gpsStat.textContent = "Inactive";
                gpsStat.className = "font-bold text-slate-400 text-sm";
            } else {
                // Start Continuous High-Accuracy Tracking
                if (!("geolocation" in navigator)) {
                    alert("Geolocation is not supported by your browser.");
                    return;
                }

                locateText.textContent = "Locating...";
                locateIcon.className = "fa-solid fa-spinner fa-spin text-sky-400";

                watchId = navigator.geolocation.watchPosition(
                    onPositionSuccess,
                    onPositionError,
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            }
        }

        function onPositionSuccess(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            const latLng = [lat, lng];

            // Create initial marker and circle if first fix
            if (!userLocationMarker) {
                const customIcon = L.divIcon({
                    className: 'user-location-pulse',
                    html: '<div class="w-4 h-4 bg-sky-500 rounded-full border-2 border-white shadow-lg"></div>',
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                userLocationMarker = L.marker(latLng, { icon: customIcon }).addTo(map);
                userAccuracyCircle = L.circle(latLng, { 
                    radius: accuracy, 
                    color: '#38bdf8', 
                    weight: 1, 
                    opacity: 0.4, 
                    fillColor: '#38bdf8', 
                    fillOpacity: 0.15 
                }).addTo(map);

                // Pan map to location on first fix
                map.panTo(latLng);
            } else {
                // Smoothly update marker position and accuracy radius in real-time
                userLocationMarker.setLatLng(latLng);
                userAccuracyCircle.setLatLng(latLng);
                userAccuracyCircle.setRadius(accuracy);
            }

            document.getElementById('btn-locate').classList.add('bg-sky-600', 'text-white');
            document.getElementById('locate-text').textContent = "Tracking Live";
            document.getElementById('locate-icon').className = "fa-solid fa-location-arrow text-white animate-pulse";
            
            const gpsStat = document.getElementById('stat-gps');
            gpsStat.textContent = `Active (±${Math.round(accuracy)}m)`;
            gpsStat.className = "font-bold text-emerald-400 text-sm";
        }

        function onPositionError(err) {
            console.warn(`Geolocation Error (${err.code}): ${err.message}`);
            alert(`Unable to retrieve location: ${err.message}`);
            toggleGeolocation();
        }

        // ==========================================
        // 5. SOCIAL FEED & TWITTER INTERACTION
        // ==========================================
        function renderSimulatedFeed() {
            const container = document.getElementById('feed-container-simulated');
            container.innerHTML = simulatedPosts.map(post => `
                <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl p-3.5 space-y-2 hover:border-slate-700 transition">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                            <img src="${post.avatar}" alt="${post.author}" class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700">
                            <div>
                                <h4 class="text-xs font-bold text-slate-200 leading-tight">${post.author}</h4>
                                <span class="text-[11px] text-slate-400">${post.handle}</span>
                            </div>
                        </div>
                        <span class="text-[10px] text-slate-400">${post.time}</span>
                    </div>
                    <p class="text-xs text-slate-300 leading-relaxed">${highlightHashtags(post.content)}</p>
                    <div class="flex items-center gap-4 text-slate-400 text-[11px] pt-1">
                        <button class="hover:text-rose-400 flex items-center gap-1 transition">
                            <i class="fa-regular fa-heart"></i> <span>${post.likes}</span>
                        </button>
                        <button class="hover:text-emerald-400 flex items-center gap-1 transition">
                            <i class="fa-solid fa-retweet"></i> <span>${post.retweets}</span>
                        </button>
                        <button onclick="sharePost('${post.id}')" class="hover:text-sky-400 flex items-center gap-1 transition ml-auto">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function highlightHashtags(text) {
            return text.replace(/(#[a-zA-Z0-9_]+)/g, '<span class="text-sky-400 font-medium">$1</span>');
        }

        function promptHashtagChange() {
            const newTag = prompt("Enter hashtag or keyword to filter:", activeHashtag);
            if (newTag && newTag.trim() !== "") {
                activeHashtag = newTag.startsWith('#') ? newTag.trim() : `#${newTag.trim()}`;
                document.getElementById('feed-hashtag-display').textContent = activeHashtag;
            }
        }

        function sharePost(id) {
            const post = simulatedPosts.find(p => p.id == id);
            if (post) {
                const dummyText = `"${post.content}" - shared from Live Route Tracker`;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(dummyText);
                    alert("Post copied to clipboard!");
                } else {
                    document.execCommand('copy');
                    alert("Post copied to clipboard!");
                }
            }
        }
    </script>
</body>
</html>
