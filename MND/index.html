<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Event Route Tracker & Social Feed</title>
    
    <!-- PWA Specific Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nick's MND Walk">
    <link rel="icon" type="image/svg+xml" href="mnd.svg">
    <link rel="apple-touch-icon" href="mnd.svg">
  
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Dark Theme & Custom Map Styles */
        .leaflet-container {
            background-color: #0f172a !important;
        }
        .leaflet-control-layers {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
            border-radius: 0.75rem !important;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5) !important;
        }
        .leaflet-control-layers-toggle {
            filter: invert(1);
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }
        /* Custom pulse animation for live location marker */
        @keyframes pulse-ring {
            0% { transform: scale(0.33); opacity: 0.8; }
            80%, 100% { transform: scale(2.2); opacity: 0; }
        }
        .user-location-pulse {
            position: relative;
        }
        .user-location-pulse::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background-color: #0284c7;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden select-none bg-slate-950">

    <!-- TOP TAB NAVIGATION BAR -->
    <nav class="shrink-0 bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 z-30 shadow-md">
        <!-- Tab Switcher Buttons -->
        <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 w-full sm:w-auto">
            <button id="tab-btn-map" onclick="switchTab('map')"
                    class="flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-sky-600 text-white shadow-sm cursor-pointer">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Route Map</span>
            </button>
            <button id="tab-btn-feed" onclick="switchTab('feed')"
                    class="flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 cursor-pointer">
                <i class="fa-solid fa-rss"></i>
                <span>Live Stream</span>
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            </button>
        </div>

        <!-- Compact Status Pill (Desktop) -->
        <div class="hidden md:flex items-center gap-2 text-xs text-slate-400 pr-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="font-medium text-slate-200">Nick's MND Walk</span>
        </div>
    </nav>

    <!-- TAB 1: FULL-SCREEN MAP PANEL -->
    <main id="panel-map" class="relative flex-1 w-full h-full bg-slate-900">
        
        <!-- Leaflet Map Container -->
        <div id="map" class="absolute inset-0 z-0 h-full w-full"></div>

        <!-- Floating Top Overlay Controls Bar -->
        <div class="absolute top-4 left-4 right-16 sm:right-auto z-10 flex flex-wrap gap-2 items-center">
            <!-- App Branding Badge -->
            <div class="bg-slate-900/90 backdrop-blur-md border border-slate-700/60 rounded-xl px-4 py-2.5 shadow-xl flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <div>
                    <h1 class="text-sm font-bold text-slate-100 leading-tight">Route & Live Tracker</h1>
                    <p class="text-[11px] text-slate-400 font-medium" id="route-status">Loading GPX Tracks...</p>
                </div>
            </div>

            <!-- Quick Action Buttons -->
            <div class="flex items-center gap-2 bg-slate-900/90 backdrop-blur-md border border-slate-700/60 p-1.5 rounded-xl shadow-xl">
                <!-- Fit Route Button -->
                <button onclick="fitMapToRoute()" title="Recenter Route" 
                        class="p-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all border border-slate-700 active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-route text-amber-400"></i>
                </button>
            </div>
        </div>

        <!-- Floating Stats & Legend Drawer (Bottom Left on Map) -->
        <div class="absolute bottom-4 left-4 z-10 flex flex-wrap items-center gap-3 bg-slate-900/90 backdrop-blur-md border border-slate-800 p-3 rounded-xl shadow-2xl text-xs">
            <div class="flex flex-col">
                <span class="text-[10px] uppercase font-bold text-slate-400">Main Distance</span>
                <span id="stat-distance" class="font-bold text-slate-100 text-sm">-- km</span>
            </div>
            <div class="w-px h-7 bg-slate-800"></div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase font-bold text-slate-400">Live GPS</span>
                <span id="stat-gps" class="font-bold text-slate-400 text-sm">Starting...</span>
            </div>
            <div class="w-px h-7 bg-slate-800"></div>
            <!-- Route Legend -->
            <div class="flex flex-col gap-1">
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-1 rounded-full bg-sky-500 inline-block"></span>
                    <span class="text-[11px] text-slate-300 font-medium">Main Route</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-1 rounded-full bg-red-500 inline-block"></span>
                    <span class="text-[11px] text-slate-300 font-medium">High Tide Diversion</span>
                </div>
            </div>
        </div>
    </main>

    <!-- TAB 2: FULL-SCREEN PADLET FEED PANEL -->
    <section id="panel-feed" class="hidden flex-1 w-full h-full bg-slate-900 flex-col overflow-hidden">
        <!-- Padlet Live Feed Container -->
        <div id="feed-container-simulated" class="flex-1 w-full h-full flex flex-col">
            <!-- Feed injected dynamically via JS -->
        </div>
    </section>

    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        // 1. GLOBAL STATE & CONFIGURATION
        // ==========================================
        const POSITION_UPDATE_INTERVAL_MS = 60 * 1000; // Every 1 minute

        let map;
        let routeLayer = null;
        let diversionLayer = null;
        let userLocationMarker = null;
        let userAccuracyCircle = null;
        let locationIntervalId = null;
        let hasCenteredOnUser = false;
        
        // Sample GPX Coordinate Fallback Data (Felixstowe Ferry Coastal Walk)
        const sampleCoordinates = [
            [51.9808, 1.3986],
            [51.9825, 1.3960],
            [51.9850, 1.3942],
            [51.9890, 1.3910],
            [51.9930, 1.3885],
            [51.9960, 1.3860],
            [51.9910, 1.3840],
            [51.9840, 1.3920],
            [51.9808, 1.3986]
        ];

        // ==========================================
        // 2. TAB SWITCHING LOGIC
        // ==========================================
        function switchTab(tabName) {
            const mapPanel = document.getElementById('panel-map');
            const feedPanel = document.getElementById('panel-feed');
            const mapBtn = document.getElementById('tab-btn-map');
            const feedBtn = document.getElementById('tab-btn-feed');

            const activeClasses = ['bg-sky-600', 'text-white', 'shadow-sm'];
            const inactiveClasses = ['text-slate-400', 'hover:text-slate-200', 'hover:bg-slate-800/60'];

            if (tabName === 'map') {
                mapPanel.classList.remove('hidden');
                feedPanel.classList.add('hidden');
                feedPanel.classList.remove('flex');

                mapBtn.classList.add(...activeClasses);
                mapBtn.classList.remove(...inactiveClasses);
                feedBtn.classList.remove(...activeClasses);
                feedBtn.classList.add(...inactiveClasses);

                if (map) {
                    setTimeout(() => map.invalidateSize(), 50);
                }
            } else {
                mapPanel.classList.add('hidden');
                feedPanel.classList.remove('hidden');
                feedPanel.classList.add('flex');

                feedBtn.classList.add(...activeClasses);
                feedBtn.classList.remove(...inactiveClasses);
                mapBtn.classList.remove(...activeClasses);
                mapBtn.classList.add(...inactiveClasses);
            }
        }

        // ==========================================
        // 3. INITIALIZATION ON LOAD
        // ==========================================
        window.onload = async function() {
            initMap();
            await loadAllRoutes();
            renderSimulatedFeed();
            startPeriodicGeolocation();
        };

        // Initialize Leaflet Map with OpenStreetMap as Default
        function initMap() {
            map = L.map('map', {
                zoomControl: false
            }).setView([51.9808, 1.3986], 14);

            // Re-add Zoom Control to Top Right
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Standard OpenStreetMap Tile Layer
            const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            });

            const esriWorldTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 18,
                attribution: 'Tiles © Esri'
            });

            const cartoDarkMatter = L.tileLayer('https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>'
            });

            // Set OpenStreetMap as Default Tile Layer
            osmStandard.addTo(map);

            // Add Layer Switcher Control
            const baseMaps = {
                "OpenStreetMap": osmStandard,
                "Esri Topo": esriWorldTopo,
                "Carto Dark": cartoDarkMatter
            };
            L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);
        }

        // Helper to fetch GPX XML from candidate paths
        async function fetchGpxXml(candidatePaths) {
            for (const path of candidatePaths) {
                try {
                    const response = await fetch(path, { cache: 'no-store' });
                    if (response.ok) {
                        const text = await response.text();
                        return { text, path };
                    }
                } catch (e) {
                    // Try next path candidate
                }
            }
            return null;
        }

        // Parse <trkpt> coordinates from GPX XML string
        function parseGpxCoordinates(gpxXmlString) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(gpxXmlString, "text/xml");
            const trackPoints = xmlDoc.getElementsByTagName("trkpt");
            const coords = [];

            for (let i = 0; i < trackPoints.length; i++) {
                const lat = parseFloat(trackPoints[i].getAttribute("lat"));
                const lon = parseFloat(trackPoints[i].getAttribute("lon"));
                if (!isNaN(lat) && !isNaN(lon)) {
                    coords.push([lat, lon]);
                }
            }
            return coords;
        }

        // Load Main Route + High Tide Diversion Route
        async function loadAllRoutes() {
            const statusLabels = [];

            // 1. Load Main Route (MNDWalk.gpx)
            const mainGpx = await fetchGpxXml(['MNDWalk.gpx', './MNDWalk.gpx', 'mndwalk.gpx', './mndwalk.gpx', 'MNDWalk.GPX']);
            if (mainGpx) {
                const coords = parseGpxCoordinates(mainGpx.text);
                if (coords.length > 0) {
                    if (routeLayer) map.removeLayer(routeLayer);
                    routeLayer = L.polyline(coords, {
                        color: '#0284c7',
                        weight: 5,
                        opacity: 0.9,
                        lineCap: 'round'
                    }).bindPopup('<strong>Main Walk Route</strong>').addTo(map);

                    let totalMeters = 0;
                    for (let j = 0; j < coords.length - 1; j++) {
                        totalMeters += L.latLng(coords[j]).distanceTo(L.latLng(coords[j + 1]));
                    }
                    document.getElementById('stat-distance').textContent = (totalMeters / 1000).toFixed(2) + " km";
                    statusLabels.push(mainGpx.path);
                }
            } else {
                loadSampleRoute();
                statusLabels.push("Sample Route");
            }

            // 2. Load High Tide Diversion Route (NicksMNDHighTideDiversion.gpx) in Red
            const diversionGpx = await fetchGpxXml([
                'NicksMNDHighTideDiversion.gpx',
                './NicksMNDHighTideDiversion.gpx',
                'nicksmndhightidediversion.gpx',
                './nicksmndhightidediversion.gpx',
                'NicksMNDHighTideDiversion.GPX'
            ]);

            if (diversionGpx) {
                const divCoords = parseGpxCoordinates(diversionGpx.text);
                if (divCoords.length > 0) {
                    if (diversionLayer) map.removeLayer(diversionLayer);
                    diversionLayer = L.polyline(divCoords, {
                        color: '#ef4444', // Red
                        weight: 5,
                        opacity: 0.95,
                        dashArray: '8, 6',
                        lineCap: 'round'
                    }).bindPopup('<strong>High Tide Diversion</strong>').addTo(map);

                    statusLabels.push("High Tide Diversion");
                }
            } else {
                console.warn("NicksMNDHighTideDiversion.gpx could not be loaded.");
            }

            // Update status text & fit bounds to show both tracks
            if (window.location.protocol === 'file:' && !mainGpx && !diversionGpx) {
                document.getElementById('route-status').textContent = "Opened via file:// (CORS blocks local GPX fetch)";
            } else {
                document.getElementById('route-status').textContent = `Loaded: ${statusLabels.join(' + ')}`;
            }

            fitMapToRoute();
        }

        function loadSampleRoute() {
            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.polyline(sampleCoordinates, {
                color: '#0284c7',
                weight: 5,
                opacity: 0.9,
                lineCap: 'round'
            }).bindPopup('<strong>Main Walk Route (Sample)</strong>').addTo(map);

            let totalMeters = 0;
            for (let i = 0; i < sampleCoordinates.length - 1; i++) {
                totalMeters += L.latLng(sampleCoordinates[i]).distanceTo(L.latLng(sampleCoordinates[i + 1]));
            }
            document.getElementById('stat-distance').textContent = (totalMeters / 1000).toFixed(2) + " km";
        }

        // Fit map bounds to show all loaded routes
        function fitMapToRoute() {
            const group = new L.featureGroup();
            if (routeLayer) group.addLayer(routeLayer);
            if (diversionLayer) group.addLayer(diversionLayer);

            if (group.getLayers().length > 0) {
                map.fitBounds(group.getBounds(), { padding: [50, 50] });
            }
        }

        // ==========================================
        // 4. AUTOMATIC PERIODIC GEOLOCATION LOGIC
        // ==========================================
        function startPeriodicGeolocation() {
            const gpsStat = document.getElementById('stat-gps');

            if (!("geolocation" in navigator)) {
                gpsStat.textContent = "Unsupported";
                gpsStat.className = "font-bold text-rose-400 text-sm";
                return;
            }

            requestPositionUpdate();

            if (locationIntervalId !== null) {
                clearInterval(locationIntervalId);
            }
            locationIntervalId = setInterval(requestPositionUpdate, POSITION_UPDATE_INTERVAL_MS);
        }

        function requestPositionUpdate() {
            navigator.geolocation.getCurrentPosition(
                onPositionSuccess,
                onPositionError,
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        function onPositionSuccess(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            const latLng = [lat, lng];

            if (!userLocationMarker) {
                const customIcon = L.divIcon({
                    className: 'user-location-pulse',
                    html: '<div class="w-4 h-4 bg-sky-500 rounded-full border-2 border-white shadow-lg"></div>',
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                userLocationMarker = L.marker(latLng, { icon: customIcon }).addTo(map);
                userAccuracyCircle = L.circle(latLng, { 
                    radius: accuracy, 
                    color: '#38bdf8', 
                    weight: 1, 
                    opacity: 0.4, 
                    fillColor: '#38bdf8', 
                    fillOpacity: 0.15 
                }).addTo(map);

                if (!hasCenteredOnUser) {
                    map.panTo(latLng);
                    hasCenteredOnUser = true;
                }
            } else {
                userLocationMarker.setLatLng(latLng);
                userAccuracyCircle.setLatLng(latLng);
                userAccuracyCircle.setRadius(accuracy);
            }

            const gpsStat = document.getElementById('stat-gps');
            gpsStat.textContent = `Active (±${Math.round(accuracy)}m)`;
            gpsStat.className = "font-bold text-emerald-400 text-sm";
        }

        function onPositionError(err) {
            console.warn(`Geolocation Error (${err.code}): ${err.message}`);
            const gpsStat = document.getElementById('stat-gps');
            if (err.code === err.PERMISSION_DENIED) {
                gpsStat.textContent = "Denied";
                gpsStat.className = "font-bold text-amber-400 text-sm";
            } else {
                gpsStat.textContent = "Unavailable";
                gpsStat.className = "font-bold text-slate-400 text-sm";
            }
        }

        // ==========================================
        // 5. SINGLE PADLET EMBED RENDERER
        // ==========================================
        function renderSimulatedFeed() {
            const container = document.getElementById('feed-container-simulated');
            container.innerHTML = `
                <div class="padlet-embed w-full h-full bg-[#F4F4F4]">
                    <iframe src="https://padlet.com/embed/s025e3engdws2l7dl10o" 
                            frameborder="0" 
                            allow="camera;microphone;geolocation;display-capture;clipboard-write" 
                            class="w-full h-full block border-0 m-0 p-0">
                    </iframe>
                </div>
            `;
        }
    </script>
</body>
</html>
