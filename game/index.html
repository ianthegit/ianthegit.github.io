<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Check-In Game</title>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CheckInGame">
    <link rel="apple-touch-icon" href="icon-512.png">

    <!-- Leaflet CSS for Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1, h2 { text-align: center; }
        .status-box {
            background: #e9ecef;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #218838; }
        button:disabled {
            background-color: #cccccc;
            color: #666666;
            cursor: not-allowed;
        }
        .btn-share {
            background-color: #007bff;
        }
        .btn-share:hover {
            background-color: #0069d9;
        }
        .hidden { display: none; }
        .alert {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            color: white;
        }
        .alert-danger { background-color: #dc3545; }
        .alert-success { background-color: #28a745; }
        
        #map {
            height: 250px;
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            z-index: 1;
        }
        #final-canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 id="game-title">Loading Game Configuration...</h1>
    
    <div id="game-ui" class="hidden">
        <div class="status-box">
            Points: <span id="user-points">???</span> | Status: <span id="game-status">In Progress</span>
        </div>
        
        <div id="map"></div>
        <div id="message-box"></div>
        
        <div class="form-group">
            <label for="activity-select">Select Activity Performed:</label>
            <select id="activity-select" onchange="validateActivitySelection()"></select>
        </div>
        <button id="checkin-btn" onclick="attemptCheckIn()" disabled>Check In Here</button>
    </div>

    <div id="game-over-ui" class="hidden">
        <h2>Game Over!</h2>
        <p id="game-over-reason"></p>
        <button class="btn-share" onclick="shareScorecard()">Share Scorecard 📤</button>
        <p><strong>Long-press or right-click the image below to save your result card:</strong></p>
        <canvas id="final-canvas" class="hidden"></canvas>
        <img id="downloadable-image" alt="Final Scorecard" style="width: 100%; border-radius: 8px;" />
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
    // Helper to evaluate fixed points or random point ranges from JSON
    const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const resolvePoints = (item) => {
        if (typeof item.points === 'number') return item.points;
        if (typeof item.pointsMin === 'number' && typeof item.pointsMax === 'number') {
            return getRandomInt(item.pointsMin, item.pointsMax);
        }
        return 0;
    };

    let configKey = "Debauched";
    let config = null;
    let totalPoints = 0;
    let checkedInLocations = new Set();
    let visitHistory = [];
    let isGameOver = false;

    let map = null;
    let userMarker = null;
    let locationMarkers = {};

    window.onload = async function() {
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration failed', err));
        }

        const query = window.location.search.substring(1);
        const paramKey = query.split('&')[0].split('=')[0];
        if (paramKey) {
            configKey = paramKey;
        }

        try {
            const response = await fetch(`./${configKey}.json`);
            if (!response.ok) throw new Error(`Could not load ${configKey}.json`);
            config = await response.json();
            
            // Process dynamic point values in JSON
            config.checkInRadiusYards = config.checkInRadiusYards || 150;
            config.failPenalty = config.failPenalty || { min: 1, max: 150 };
            config.activities.forEach(act => {
                act.points = resolvePoints(act);
            });
            config.locations.forEach(loc => {
                loc.points = resolvePoints(loc);
            });

            document.getElementById('game-title').innerText = config.title;
            document.body.style.backgroundImage = `url('${config.backgroundImage}')`;

            populateActivities();
            loadSavedState();

            if (isGameOver) {
                endGame("Game completed in previous session.");
            } else {
                document.getElementById('game-ui').classList.remove('hidden');
                initMap();
            }

            if (config.endTime) {
                setInterval(checkTimer, 5000);
                checkTimer();
            }
        } catch (err) {
            document.getElementById('game-title').innerText = "Configuration Error";
            document.getElementById('message-box').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            document.getElementById('game-ui').classList.remove('hidden');
        }
    };

    function saveState() {
        const storageKey = `game_state_${configKey}`;
        const stateData = {
            configLocations: config.locations,
            totalPoints: totalPoints,
            checkedInLocations: Array.from(checkedInLocations),
            visitHistory: visitHistory,
            isGameOver: isGameOver,
            expiry: new Date().setHours(23, 59, 59, 999)
        };
        localStorage.setItem(storageKey, JSON.stringify(stateData));
    }

    function loadSavedState() {
        const storageKey = `game_state_${configKey}`;
        const itemStr = localStorage.getItem(storageKey);
        if (!itemStr) return;
        try {
            const stateData = JSON.parse(itemStr);
            if (Date.now() > stateData.expiry) {
                localStorage.removeItem(storageKey);
                return;
            }
            if (stateData.configLocations) {
                config.locations = stateData.configLocations;
            }
            totalPoints = stateData.totalPoints || 0;
            checkedInLocations = new Set(stateData.checkedInLocations || []);
            visitHistory = stateData.visitHistory || [];
            isGameOver = stateData.isGameOver || false;
        } catch (e) {
            console.error("Error reading saved state", e);
            localStorage.removeItem(storageKey);
        }
    }

    function populateActivities() {
        const actSelect = document.getElementById('activity-select');
        actSelect.innerHTML = '<option value="" disabled selected>-- Select Activity --</option>';
        config.activities.forEach((act, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = `${act.name} (+??? pts)`;
            actSelect.appendChild(opt);
        });
        validateActivitySelection();
    }

    function validateActivitySelection() {
        const actSelect = document.getElementById('activity-select');
        const checkinBtn = document.getElementById('checkin-btn');
        checkinBtn.disabled = (actSelect.value === "");
    }

    function resetActivityDropdown() {
        const actSelect = document.getElementById('activity-select');
        actSelect.value = "";
        validateActivitySelection();
    }

    function initMap() {
        const defaultLat = config.locations[0].lat;
        const defaultLon = config.locations[0].lon;
        
        map = L.map('map').setView([defaultLat, defaultLon], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        renderMapMarkers();
        updateUserLocationOnMap();
    }

    function renderMapMarkers() {
        config.locations.forEach(loc => {
            const isCheckedIn = checkedInLocations.has(loc.id);
            let markerColor = isCheckedIn ? '#28a745' : (loc.id === 'endPoint' ? '#dc3545' : '#007bff');
            
            const markerOptions = {
                radius: 8,
                fillColor: markerColor,
                color: '#ffffff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            };
            if (locationMarkers[loc.id]) {
                map.removeLayer(locationMarkers[loc.id]);
            }
            const marker = L.circleMarker([loc.lat, loc.lon], markerOptions).addTo(map);
            marker.bindPopup(`<b>${loc.name}</b><br>${isCheckedIn ? 'Checked In ✔️' : 'Unvisited'}`);
            locationMarkers[loc.id] = marker;
        });
    }

    function updateUserLocationOnMap() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                if (userMarker) {
                    userMarker.setLatLng([lat, lon]);
                } else {
                    userMarker = L.circleMarker([lat, lon], {
                        radius: 7,
                        fillColor: '#3388ff',
                        color: '#ffffff',
                        weight: 3,
                        fillOpacity: 1
                    }).addTo(map);
                    userMarker.bindPopup("<b>You are here</b>");
                }
            }, null, { enableHighAccuracy: true });
        }
    }

    function attemptCheckIn() {
        if (isGameOver) return;
        const actIndex = document.getElementById('activity-select').value;
        
        if (actIndex === "" || actIndex === null) {
            showMessage("Please select an activity first!", "danger");
            return;
        }
        const activity = config.activities[actIndex];
        if (checkedInLocations.size >= config.locations.length) {
            showMessage("You have already checked into all available locations!", "danger");
            return;
        }
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLon = position.coords.longitude;
                    
                    if (userMarker) userMarker.setLatLng([userLat, userLon]);
                    let matchedLocation = null;
                    const hasStart = config.locations.some(l => l.id === 'start');
                    
                    if (hasStart && !checkedInLocations.has('start')) {
                        const startLoc = config.locations.find(l => l.id === 'start');
                        const distYards = calculateDistanceYards(userLat, userLon, startLoc.lat, startLoc.lon);
                        if (distYards <= config.checkInRadiusYards) {
                            matchedLocation = startLoc;
                        }
                    } else {
                        for (let loc of config.locations) {
                            if (checkedInLocations.has(loc.id)) continue;
                            const distYards = calculateDistanceYards(userLat, userLon, loc.lat, loc.lon);
                            if (distYards <= config.checkInRadiusYards) {
                                matchedLocation = loc;
                                break;
                            }
                        }
                    }

                    if (matchedLocation) {
                        const earnedPoints = matchedLocation.points + activity.points;
                        totalPoints += earnedPoints;
                        checkedInLocations.add(matchedLocation.id);
                        visitHistory.push({
                            type: 'success',
                            locationName: matchedLocation.name,
                            locPoints: matchedLocation.points,
                            activityName: activity.name,
                            actPoints: activity.points
                        });
                        showMessage(`Success! Checked in at "${matchedLocation.name}". Points recorded for final reveal!`, "success");
                        
                        renderMapMarkers();
                        resetActivityDropdown();
                        if (matchedLocation.id === 'endPoint') {
                            endGame("Reached the final end point!");
                        } else {
                            saveState();
                        }
                    } else {
                        const penalty = getRandomInt(config.failPenalty.min, config.failPenalty.max);
                        totalPoints -= penalty;
                        const formattedLat = userLat.toFixed(5);
                        const formattedLon = userLon.toFixed(5);
                        visitHistory.push({
                            type: 'fail',
                            locationName: "Unknown Spot",
                            penalty: penalty,
                            userLat: formattedLat,
                            userLon: formattedLon
                        });
                        const startMsg = (hasStart && !checkedInLocations.has('start')) ? " (You must be at the 'Start' location first)" : "";
                        
                        showMessage(
                            `Check-in failed! You are not within ${config.checkInRadiusYards} yards of an available location${startMsg}.<br>` +
                            `<strong>Your Location:</strong> Lat: ${formattedLat}, Lon: ${formattedLon}<br>` +
                            `Penalty recorded!`, 
                            "danger"
                        );
                        resetActivityDropdown();
                        saveState();
                    }
                },
                (error) => {
                    showMessage("Error getting GPS location. Please enable location services.", "danger");
                },
                { enableHighAccuracy: true }
            );
        } else {
            showMessage("Geolocation is not supported by your browser.", "danger");
        }
    }

    function calculateDistanceYards(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const rad = Math.PI / 180;
        const dLat = (lat2 - lat1) * rad;
        const dLon = (lon2 - lon1) * rad;
        
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c * 1.09361;
    }

    function showMessage(msg, type) {
        const msgBox = document.getElementById('message-box');
        msgBox.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }

    function checkTimer() {
        if (config.endTime && new Date() >= new Date(config.endTime) && !isGameOver) {
            endGame("Time has expired!");
        }
    }

    function endGame(reason) {
        isGameOver = true;
        saveState();
        document.getElementById('game-ui').classList.add('hidden');
        document.getElementById('game-over-ui').classList.remove('hidden');
        document.getElementById('game-over-reason').innerText = reason;
        generateSummaryCanvas();
    }

    function generateSummaryCanvas() {
        const canvas = document.getElementById('final-canvas');
        const ctx = canvas.getContext('2d');
        const bgImg = new Image();
        bgImg.src = config.backgroundImage;
        bgImg.onload = function() {
            canvas.width = 800;
            canvas.height = 1100;
            
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            
            const hotPink = "#FF69B4";
            ctx.fillStyle = hotPink;
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 3;
            
            ctx.font = "bold 38px Arial";
            ctx.textAlign = "center";
            ctx.strokeText(config.title, canvas.width / 2, 90);
            ctx.fillText(config.title, canvas.width / 2, 90);
            
            ctx.font = "bold 26px Arial";
            ctx.strokeText("Final Mystery Scorecard", canvas.width / 2, 130);
            ctx.fillText("Final Mystery Scorecard", canvas.width / 2, 130);
            
            let startY = 180;
            ctx.textAlign = "left";
            ctx.font = "bold 20px Arial";
            
            if (visitHistory.length === 0) {
                ctx.strokeText("No check-in attempts recorded.", 70, startY);
                ctx.fillText("No check-in attempts recorded.", 70, startY);
                startY += 40;
            } else {
                visitHistory.forEach((item, idx) => {
                    if (item.type === 'success') {
                        const line1 = `${idx + 1}. [SUCCESS] ${item.locationName} (+${item.locPoints} pts)`;
                        const line2 = `   Activity: ${item.activityName} (${item.actPoints >= 0 ? '+' : ''}${item.actPoints} pts)`;
                        
                        ctx.strokeText(line1, 70, startY);
                        ctx.fillText(line1, 70, startY);
                        ctx.strokeText(line2, 70, startY + 24);
                        ctx.fillText(line2, 70, startY + 24);
                        
                        startY += 60;
                    } else if (item.type === 'fail') {
                        const failLine1 = `${idx + 1}. [FAILED] Check-In Attempt`;
                        const failLine2 = `   Lat: ${item.userLat}, Lon: ${item.userLon} (-${item.penalty} pts)`;
                        
                        ctx.strokeText(failLine1, 70, startY);
                        ctx.fillText(failLine1, 70, startY);
                        ctx.strokeText(failLine2, 70, startY + 24);
                        ctx.fillText(failLine2, 70, startY + 24);
                        
                        startY += 60;
                    }
                });
            }
            
            ctx.strokeStyle = hotPink;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(70, startY + 10);
            ctx.lineTo(canvas.width - 70, startY + 10);
            ctx.stroke();
            
            ctx.font = "bold 36px Arial";
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 4;
            ctx.strokeText(`FINAL SCORE: ${totalPoints} PTS`, 70, startY + 70);
            ctx.fillText(`FINAL SCORE: ${totalPoints} PTS`, 70, startY + 70);
            
            const dataUrl = canvas.toDataURL("image/png");
            const imgElement = document.getElementById('downloadable-image');
            imgElement.src = dataUrl;
        };
    }

    async function shareScorecard() {
        const canvas = document.getElementById('final-canvas');
        canvas.toBlob(async (blob) => {
            const file = new File([blob], 'scorecard.png', { type: 'image/png' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: config.title,
                        text: `I finished ${config.title} with a score of ${totalPoints} PTS! Check out my scorecard:`,
                        files: [file]
                    });
                } catch (err) {
                    console.error("Error sharing:", err);
                }
            } else {
                const link = document.createElement('a');
                link.download = 'scorecard.png';
                link.href = canvas.toDataURL();
                link.click();
            }
        });
    }
</script>
</body>
</html>
